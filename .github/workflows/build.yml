# Builds and tests Magnolia on macOS, Windows and Linux for every push and
# pull request, and runs its end-to-end tests in the app on each. Each platform compiles its own native code (WebKit / WebView2
# / WebKitGTK printing), so this is the check that all three still build.
# It doesn't produce installers — releases are cut as in RELEASING.md.

name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manual/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libxml2-utils xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Renderer typecheck, lint and tests
        run: |
          npm run typecheck
          npm run lint
          npx vitest run

      - name: Rust lint and tests (core and app)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build the app
        run: npx tauri build --no-bundle

      # The app itself, driven as a user drives it (e2e/README.md), in a
      # development build (automation is compiled out of release builds).
      # Linux has no screen here, so it gets a virtual one.
      - name: End-to-end tests
        shell: bash
        run: |
          cargo build -p magnolia
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} node e2e/run.mjs
