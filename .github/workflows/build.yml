# Builds and tests Magnolia on macOS, Windows and Linux for every push and
# pull request. Each platform compiles its own native code (WebKit / WebView2
# / WebKitGTK printing), so this is the check that all three still build.
# It doesn't produce installers — releases are cut as in RELEASING.md.

name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manual/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libxml2-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Renderer typecheck and tests
        run: |
          npm run typecheck
          npx vitest run

      - name: Core tests (QDPX, converters)
        run: cargo test -p magnolia-core

      - name: Build the app
        run: npx tauri build --no-bundle
