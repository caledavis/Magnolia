# Builds Magnolia's Linux release (AppImage, .deb, .rpm) on Ubuntu 22.04 and
# uploads it to the draft release for package.json's version.
#
# Why here and not on a Linux desktop: an AppImage bundles most libraries
# from the machine it was built on but takes glibc, libgpg-error and a few
# others from the user's system. Built on a recent distro, it needs that
# distro's glibc (so it won't start on Ubuntu 22.04 or Debian 12) and bundles
# a libgcrypt that the user's older libgpg-error can't satisfy (issue #31:
# "undefined symbol: gpgrt_add_post_log_func"). Building on the oldest
# supported base avoids both.
#
# `npm run release:linux` starts it (from any machine) and follows it; or run
# it from the Actions tab ("Release (Linux)" → Run workflow). Then run
# `npm run release:finish` as usual.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the contents of
# ~/.tauri/magnolia-updater.key); see RELEASING.md.

name: Release (Linux)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to the draft release (untick to only build and test)
        type: boolean
        default: true
      check_release:
        description: Instead of building, only smoke-test the AppImage of this published release (e.g. v2.0.0)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: inputs.check_release == ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libxml2-utils file

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build and collect
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release.mjs release linux --no-upload

      - uses: actions/upload-artifact@v7
        with:
          name: magnolia-linux
          path: release/Magnolia-linux-*
          if-no-files-found: error

  # Start the AppImage on clean systems. There's no display, so the app
  # itself stops at GTK; what matters is that it gets that far, past the
  # dynamic loader (missing glibc versions, undefined symbols).
  smoke:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.check_release != '') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        if: inputs.check_release == ''
        with:
          name: magnolia-linux

      - name: Runtime libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 ca-certificates curl
          # Sound is on every desktop but not in a bare container (the
          # package was renamed in Ubuntu 24.04).
          apt-get install -y --no-install-recommends libasound2t64 || apt-get install -y --no-install-recommends libasound2

      - name: Download ${{ inputs.check_release }}
        if: inputs.check_release != ''
        run: curl -fsSL -o Magnolia-linux-x86_64.AppImage "https://github.com/${{ github.repository }}/releases/download/${{ inputs.check_release }}/Magnolia-linux-x86_64.AppImage"

      - name: Start the AppImage
        run: |
          chmod +x Magnolia-linux-x86_64.AppImage
          timeout 60 ./Magnolia-linux-x86_64.AppImage --appimage-extract-and-run > run.log 2>&1 || true
          cat run.log
          if grep -Eq 'symbol lookup error|undefined symbol|error while loading shared libraries|version .GLIBC' run.log; then
            echo "::error::The AppImage failed to load its libraries on ${{ matrix.image }}"
            exit 1
          fi

  upload:
    needs: smoke
    if: inputs.upload && inputs.check_release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: magnolia-linux
          path: release

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release upload "$tag" release/Magnolia-linux-* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded to $tag. Now run npm run release:finish."
