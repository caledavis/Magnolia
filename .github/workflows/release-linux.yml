# Builds Magnolia's Linux release (AppImage, .deb, .rpm) on Ubuntu 22.04 and
# uploads it to the draft release for package.json's version.
#
# Why here and not on a Linux desktop: an AppImage bundles most libraries
# from the machine it was built on but takes glibc, libgpg-error and a few
# others from the user's system. Built on a recent distro, it needs that
# distro's glibc (so it won't start on Ubuntu 22.04 or Debian 12) and bundles
# a libgcrypt that the user's older libgpg-error can't satisfy (issue #31:
# "undefined symbol: gpgrt_add_post_log_func"). Building on the oldest
# supported base avoids both.
#
# `npm run release:linux` starts it (from any machine) and follows it; or run
# it from the Actions tab ("Release (Linux)" → Run workflow). Then run
# `npm run release:finish` as usual.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the contents of
# ~/.tauri/magnolia-updater.key); see RELEASING.md.

name: Release (Linux)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to the draft release (untick to only build and test)
        type: boolean
        default: true
      check_release:
        description: Instead of building, only smoke-test the AppImage of this published release (e.g. v2.0.0)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: inputs.check_release == ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libxml2-utils file
          # The AppImage bundles GStreamer's plugins from here
          # (bundleMediaFramework): without them it borrows the user's,
          # which a newer distro's GStreamer can't load, and nothing plays.
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          # For the bundled libraries' source code (after the build): the
          # archive's source lines, and Launchpad for versions it has dropped.
          grep -hE '^deb (\[[^]]*\] )?https?://[^ ]*ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null \
            | sed 's/^deb /deb-src /' | sudo tee /etc/apt/sources.list.d/magnolia-deb-src.list
          test -s /etc/apt/sources.list.d/magnolia-deb-src.list || { echo "::error::No Ubuntu archive lines to add deb-src for"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y ubuntu-dev-tools

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build and collect
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The AppImage bundles just the GStreamer plugins its players use,
          # which scripts/stage-appimage-gstreamer.mjs links here as Tauri is
          # about to bundle (all of the system's more than doubled its size),
          # -bad's among them (the H.264 parser, WebKit's stand-in sinks).
          GSTREAMER_PLUGINS_DIR: ${{ github.workspace }}/target/appimage-gstreamer/plugins
          GSTREAMER_INCLUDE_BAD_PLUGINS: '1'
        run: node scripts/release.mjs release linux --no-upload

      # The GPL and LGPL ask that the bundled libraries' source be offered
      # from the same place as the AppImage: it goes on the release beside it.
      - name: Collect the source code of the AppImage's libraries
        run: scripts/collect-appimage-sources.sh target/release/bundle/appimage/Magnolia.AppDir release/Magnolia-linux-x86_64-AppImage-sources.tar

      - uses: actions/upload-artifact@v7
        with:
          name: magnolia-linux
          path: |
            release/Magnolia-linux-*
            !release/Magnolia-linux-x86_64-AppImage-sources.tar
          if-no-files-found: error

      # Apart, so the smoke tests don't each download a gigabyte of source.
      - uses: actions/upload-artifact@v7
        with:
          name: magnolia-linux-sources
          path: release/Magnolia-linux-x86_64-AppImage-sources.tar
          if-no-files-found: error

  # Start the AppImage on clean systems. There's no display, so the app
  # itself stops at GTK; what matters is that it gets that far, past the
  # dynamic loader (missing glibc versions, undefined symbols).
  smoke:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.check_release != '') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        if: inputs.check_release == ''
        with:
          name: magnolia-linux

      - name: Runtime libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 ca-certificates curl
          # Sound is on every desktop but not in a bare container (the
          # package was renamed in Ubuntu 24.04).
          apt-get install -y --no-install-recommends libasound2t64 || apt-get install -y --no-install-recommends libasound2

      - name: Download ${{ inputs.check_release }}
        if: inputs.check_release != ''
        run: curl -fsSL -o Magnolia-linux-x86_64.AppImage "https://github.com/${{ github.repository }}/releases/download/${{ inputs.check_release }}/Magnolia-linux-x86_64.AppImage"

      - name: Start the AppImage
        run: |
          chmod +x Magnolia-linux-x86_64.AppImage
          timeout 60 ./Magnolia-linux-x86_64.AppImage --appimage-extract-and-run > run.log 2>&1 || true
          cat run.log
          if grep -Eq 'symbol lookup error|undefined symbol|error while loading shared libraries|version .GLIBC' run.log; then
            echo "::error::The AppImage failed to load its libraries on ${{ matrix.image }}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: scripts/check-appimage-media.py
          sparse-checkout-cone-mode: false

      # Media plays through the AppImage's own GStreamer plugins. Releases
      # up to 2.2.0 had none, so nothing played on any distro newer than
      # the one they were built on.
      - name: Check the AppImage can play audio and video
        run: |
          apt-get install -y --no-install-recommends python3
          ./Magnolia-linux-x86_64.AppImage --appimage-extract > /dev/null
          export APPDIR="$PWD/squashfs-root"
          . squashfs-root/apprun-hooks/linuxdeploy-plugin-gstreamer.sh
          LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" python3 -I source/scripts/check-appimage-media.py squashfs-root || {
            echo "::error::The AppImage can't play audio or video on ${{ matrix.image }}"
            exit 1
          }

  upload:
    needs: smoke
    if: inputs.upload && inputs.check_release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: magnolia-linux
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: magnolia-linux-sources
          path: release

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release upload "$tag" release/Magnolia-linux-* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded to $tag. Now run npm run release:finish."
